server:
  port: 8081
app:
  time-zone: ${APP_TIME_ZONE:Europe/Moscow}
  reminders:
    # Напоминание за 3 часа до начала; отправку делает планировщик (Шаг 8),
    # создание — сценарий создания записи (Шаг 5).
    offset: ${REMINDERS_OFFSET:PT3H}
  calendar:
    default-duration-minutes: ${CALENDAR_DEFAULT_DURATION_MINUTES:60}
    # Горизонт планирования: не дальше чем столько дней от текущего момента.
    max-horizon-days: ${CALENDAR_MAX_HORIZON_DAYS:730}
    # Потолок длительности одного события.
    max-duration-minutes: ${CALENDAR_MAX_DURATION_MINUTES:10080}
    # Допуск «прошедшего» времени: не отклонять, если начало совсем недавно.
    past-tolerance-seconds: ${CALENDAR_PAST_TOLERANCE_SECONDS:60}
spring:
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: musicx-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      # Java-миграции читают этот placeholder (например, бэкфил часовых поясов).
      app-time-zone: ${app.time-zone}

  # CORS: фронт в dev живёт на другом порту (Vite), в prod — под своим доменом.
  # Список задаётся через CORS_ALLOWED_ORIGINS, по умолчанию — локальная разработка.
  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5199,http://localhost:3000}

telegram:
  bot-token: ${BOT_TOKEN}
  max-age-seconds: ${TELEGRAM_MAX_AGE_SECONDS:86400}

jwt:
  # Подпись собственных токенов. Не связана с токеном бота.
  secret: ${JWT_SECRET}
  # Время жизни выданного токена, секунды.
  ttl-seconds: ${JWT_TTL_SECONDS:86400}
  issuer: musicx

openrouter:
  base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
  api-key: ${OPENROUTER_API_KEY}
  # Основная и запасные модели парсинга записей: structured outputs, 1M контекст.
  # deepseek/deepseek-v4.1-flash ~$0.05/$0.20 за 1M, qwen/qwen3.8-flash ~$0.15/$0.47.
  # Важно: в каталоге OpenRouter ID с суффиксом :free — у платного варианта
  # суффикса нет. ID без суффикса = платный, с суффиксом = бесплатный лимит.
  model: ${OPENROUTER_MODEL:deepseek/deepseek-v4.1-flash}
  fallback-models: ${OPENROUTER_FALLBACK_MODELS:qwen/qwen3.8-flash}
  # Одна попытка ограничена таймаутом HTTP; суммарный бюджет попыток ~25 с
  # держит LlmEventParser, потому что черновик в Telegram живёт ~30 секунд.
  attempt-timeout-seconds: ${OPENROUTER_ATTEMPT_TIMEOUT_SECONDS:12}

---
# Профиль для тестов: свои значения, чтобы не требовать реальный .env.
spring:
  config:
    activate:
      on-profile: test

telegram:
  bot-token: test-bot-token
  max-age-seconds: 86400

jwt:
  secret: test-secret-key-for-unit-tests-only-not-for-production-use
  ttl-seconds: 3600
  issuer: musicx-test