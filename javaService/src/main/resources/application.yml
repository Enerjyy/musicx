server:
  port: 8081
spring:
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # CORS: фронт в dev живёт на другом порту (Vite), в prod — под своим доменом.
  # Список задаётся через CORS_ALLOWED_ORIGINS, по умолчанию — локальная разработка.
  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5199,http://localhost:3000}

telegram:
  bot-token: ${BOT_TOKEN}
  # Сколько секунд initData считается свежим. Подписанные данные от Telegram
  # не протухают сами по себе — auth_date единственная защита от реиграбельности.
  # Сутки: Mini App не обновляет initData, короткое окно выкидывало бы из сессии.
  max-age-seconds: ${TELEGRAM_MAX_AGE_SECONDS:86400}

jwt:
  # Подпись собственных токенов. Не связана с токеном бота.
  secret: ${JWT_SECRET}
  # Время жизни выданного токена, секунды.
  ttl-seconds: ${JWT_TTL_SECONDS:86400}
  issuer: musicx

---
# Профиль для тестов: свои значения, чтобы не требовать реальный .env.
spring:
  config:
    activate:
      on-profile: test

telegram:
  bot-token: test-bot-token
  max-age-seconds: 86400

jwt:
  secret: test-secret-key-for-unit-tests-only-not-for-production-use
  ttl-seconds: 3600
  issuer: musicx-test