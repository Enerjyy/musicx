app:
  kafka:
    topics:
      # Брокера в тестах нет: KafkaAdmin не должен пытаться создавать топики.
      auto-create: false

spring:
  datasource:
    # H2 в памяти: интеграционные тесты не должны требовать внешнюю БД.
    url: jdbc:h2:mem:musictest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      app-time-zone: Europe/Moscow

  kafka:
    # Брокер в тестах не нужен: продюсер создаётся, но никто не отправляет.
    bootstrap-servers: localhost:9092

  web:
    cors:
      allowed-origins: http://localhost:5173

telegram:
  bot-token: test-bot-token-1234567890
  max-age-seconds: 86400

openrouter:
  base-url: http://localhost:1
  api-key: test-key
  model: test/model

jwt:
  secret: integration-test-secret-key-at-least-32-bytes
  ttl-seconds: 3600
  issuer: musicx-test